name: Main PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: main-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.28.2
  API_URL: https://api.example.com/v1
  NEXT_PUBLIC_USE_MSW: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fast
        run: pnpm verify:fast

      - name: Build
        run: pnpm build

      - name: Verify dongle-client build output
        run: |
          if [ ! -d apps/DONGLE-CLIENT/.next ]; then
            echo "::error::apps/DONGLE-CLIENT/.next does not exist after pnpm build"
            find apps/DONGLE-CLIENT -maxdepth 1
            exit 1
          fi
          ls -la apps/DONGLE-CLIENT/.next

      - name: Upload dongle-client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongle-client-next
          path: apps/DONGLE-CLIENT/.next
          retention-days: 1
          if-no-files-found: error

  e2e-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_SKIP_CLIENT_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dongle-client build artifact
        uses: actions/download-artifact@v4
        with:
          name: dongle-client-next
          path: apps/DONGLE-CLIENT/.next

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 7
